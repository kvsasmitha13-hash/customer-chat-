<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Support Chat</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#dbeafe,#eff6ff);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.chat {
    width: 400px;
    height: 600px;
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 8px 30px #777;
}

/* Header */
.header {
    background: #007bff;
    color: white;
    padding: 18px;
}

.header h2 {
    margin: 0;
}

.status {
    font-size: 13px;
    color: #c8ffc8;
}

/* Chat area */
.chat-box {
    height: 400px;
    padding: 15px;
    overflow-y: auto;
    background: #f5f7fb;
}

.message {
    max-width: 75%;
    padding: 10px 14px;
    margin: 8px 0;
    border-radius: 15px;
}

.bot {
    background: #e1e1e1;
}

.user {
    background: #007bff;
    color: white;
    margin-left: auto;
}

.time {
    display: block;
    font-size: 10px;
    opacity: .6;
    margin-top: 4px;
}

/* Typing */
.typing {
    display: none;
    font-size: 13px;
    color: gray;
    padding: 5px 15px;
}

/* Quick buttons */
.quick {
    padding: 8px;
    text-align: center;
}

.quick button {
    border: 1px solid #007bff;
    background: white;
    color: #007bff;
    padding: 6px 10px;
    border-radius: 15px;
    cursor: pointer;
}

/* Input */
.input-area {
    display: flex;
    padding: 10px;
    gap: 5px;
}

.input-area input {
    flex: 1;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 20px;
}

.input-area button {
    border: none;
    border-radius: 50%;
    width: 42px;
    background: #007bff;
    color: white;
    cursor: pointer;
}

/* Bottom buttons */
.bottom {
    display: flex;
    justify-content: space-around;
    padding: 5px;
}

.bottom button {
    border: none;
    background: none;
    cursor: pointer;
    font-size: 18px;
}

/* Dark mode */
.dark {
    background: #111827;
}

.dark .chat {
    background: #1f2937;
}

.dark .chat-box {
    background: #111827;
}

.dark .bot {
    background: #374151;
    color: white;
}
</style>
</head>

<body>

<div class="chat">

    <div class="header">
        <h2>💬 Customer Support</h2>
        <span class="status">● Online</span>
    </div>

    <div class="chat-box" id="chatBox">

        <div class="message bot">
            Hello 👋<br>
            Welcome to Customer Support!
            <span class="time">Now</span>
        </div>

    </div>

    <div class="typing" id="typing">
        Support is typing...
    </div>

    <div class="quick">
        <button onclick="quickMessage('Track my order')">
            📦 Track Order
        </button>

        <button onclick="quickMessage('I need help')">
            🆘 Help
        </button>
    </div>

    <div class="input-area">

        <button onclick="emoji()">😊</button>

        <input
            type="text"
            id="message"
            placeholder="Type your message..."
        >

        <button onclick="sendMessage()">➤</button>

    </div>

    <div class="bottom">

        <button onclick="clearChat()" title="Clear Chat">
            🗑️
        </button>

        <button onclick="darkMode()" title="Dark Mode">
            🌙
        </button>

        <button onclick="alert('Support team is available 24/7!')">
            ℹ️
        </button>

    </div>

</div>

<script>

let input = document.getElementById("message");
let chatBox = document.getElementById("chatBox");

/* Send message */
function sendMessage() {

    let text = input.value.trim();

    if (text === "") return;

    addMessage(text, "user");

    input.value = "";

    document.getElementById("typing").style.display = "block";

    setTimeout(function() {

        document.getElementById("typing").style.display = "none";

        let reply = getReply(text);

        addMessage(reply, "bot");

    }, 1000);
}

/* Add message */
function addMessage(text, type) {

    let message = document.createElement("div");

    message.className = "message " + type;

    let time = new Date().toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
    });

    message.innerHTML =
        text + '<span class="time">' + time + '</span>';

    chatBox.appendChild(message);

    chatBox.scrollTop = chatBox.scrollHeight;

    localStorage.setItem("chat", chatBox.innerHTML);
}

/* Automatic replies */
function getReply(text) {

    text = text.toLowerCase();

    if (text.includes("hello") || text.includes("hi"))
        return "Hello! 😊 How can I help you?";

    if (text.includes("order"))
        return "📦 Please provide your order ID to track your order.";

    if (text.includes("price"))
        return "💰 Please tell me which product price you want to know.";

    if (text.includes("refund"))
        return "💳 Refund requests are usually processed within 5-7 working days.";

    if (text.includes("help"))
        return "🆘 Sure! Please explain your problem.";

    if (text.includes("thank"))
        return "You're welcome! 😊";

    return "Thank you for contacting us. Our support team will assist you shortly.";
}

/* Quick message */
function quickMessage(text) {

    input.value = text;
    sendMessage();

}

/* Emoji */
function emoji() {

    input.value += " 😊";
    input.focus();

}

/* Enter key */
input.addEventListener("keypress", function(event) {

    if (event.key === "Enter") {
        sendMessage();
    }

});

/* Clear chat */
function clearChat() {

    if (confirm("Clear chat history?")) {

        chatBox.innerHTML = "";

        localStorage.removeItem("chat");

    }

}

/* Dark mode */
function darkMode() {

    document.body.classList.toggle("dark");

}

/* Load chat history */
window.onload = function() {

    let savedChat = localStorage.getItem("chat");

    if (savedChat) {
        chatBox.innerHTML = savedChat;
    }

};

</script>

</body>
</html>
