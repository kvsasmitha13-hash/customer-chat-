<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Customer Support Chat</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#dbeafe,#f0f9ff);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.chat {
    width: 420px;
    height: 650px;
    background: white;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 8px 30px #777;
}

/* HEADER */
.header {
    background: #007bff;
    color: white;
    padding: 15px;
    display: flex;
    align-items: center;
}

.profile {
    width: 45px;
    height: 45px;
    background: white;
    color: #007bff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    margin-right: 10px;
}

.header h3 {
    margin: 0;
}

.status {
    font-size: 12px;
    color: #c8ffc8;
}

/* CHAT AREA */
.chat-box {
    height: 380px;
    padding: 15px;
    overflow-y: auto;
    background: #f5f7fb;
}

.message {
    max-width: 78%;
    padding: 10px 13px;
    margin: 9px 0;
    border-radius: 15px;
    position: relative;
}

.bot {
    background: #e1e1e1;
}

.user {
    background: #007bff;
    color: white;
    margin-left: auto;
}

.time {
    display: block;
    font-size: 9px;
    opacity: .6;
    margin-top: 5px;
}

/* COPY BUTTON */
.copy {
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 11px;
    margin-left: 5px;
}

/* TYPING */
.typing {
    display: none;
    padding: 5px 15px;
    color: gray;
    font-size: 13px;
}

/* QUICK REPLIES */
.quick {
    padding: 6px;
    text-align: center;
}

.quick button {
    border: 1px solid #007bff;
    background: white;
    color: #007bff;
    padding: 6px 9px;
    border-radius: 15px;
    cursor: pointer;
    margin: 2px;
}

.quick button:hover {
    background: #007bff;
    color: white;
}

/* INPUT */
.input-area {
    display: flex;
    gap: 5px;
    padding: 10px;
}

.input-area input {
    flex: 1;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 20px;
    outline: none;
}

.input-area button {
    width: 42px;
    border: none;
    border-radius: 50%;
    background: #007bff;
    color: white;
    cursor: pointer;
}

/* EMOJI */
.emoji-box {
    display: none;
    text-align: center;
    padding: 5px;
    font-size: 22px;
}

.emoji-box span {
    cursor: pointer;
    margin: 3px;
}

/* BOTTOM */
.bottom {
    display: flex;
    justify-content: space-around;
    padding: 7px;
}

.bottom button {
    border: none;
    background: transparent;
    cursor: pointer;
    font-size: 18px;
}

/* RATING */
.rating {
    display: none;
    text-align: center;
    padding: 10px;
}

.rating span {
    font-size: 28px;
    cursor: pointer;
}

/* DARK MODE */
.dark {
    background: #111827;
}

.dark .chat {
    background: #1f2937;
}

.dark .chat-box {
    background: #111827;
}

.dark .bot {
    background: #374151;
    color: white;
}

.dark input {
    background: #374151;
    color: white;
}

/* MOBILE */
@media(max-width:500px) {

    .chat {
        width: 95%;
        height: 95vh;
    }

    .chat-box {
        height: 55vh;
    }
}
</style>
</head>

<body>

<div class="chat">

<!-- HEADER -->
<div class="header">

    <div class="profile">👩‍💼</div>

    <div>
        <h3>Customer Support</h3>
        <div class="status">🟢 Online • Available 24/7</div>
    </div>

</div>


<!-- CHAT -->
<div class="chat-box" id="chatBox">

    <div class="message bot">

        Hello! 👋

        <br>

        Welcome to Customer Support.

        <br>

        How can I help you today?

        <span class="time">Now</span>

    </div>

</div>


<!-- TYPING -->
<div class="typing" id="typing">
    Support is typing...
</div>


<!-- QUICK REPLIES -->
<div class="quick">

    <button onclick="quickMessage('Track my order')">
        📦 Track Order
    </button>

    <button onclick="quickMessage('I need a refund')">
        💳 Refund
    </button>

    <button onclick="quickMessage('I need help')">
        🆘 Help
    </button>

</div>


<!-- EMOJI -->
<div class="emoji-box" id="emojiBox">

    <span onclick="addEmoji('😊')">😊</span>
    <span onclick="addEmoji('😂')">😂</span>
    <span onclick="addEmoji('❤️')">❤️</span>
    <span onclick="addEmoji('👍')">👍</span>
    <span onclick="addEmoji('😢')">😢</span>
    <span onclick="addEmoji('🙏')">🙏</span>

</div>


<!-- INPUT -->
<div class="input-area">

    <button onclick="toggleEmoji()">😊</button>

    <input
        type="text"
        id="message"
        placeholder="Type your message..."
    >

    <button onclick="sendMessage()">➤</button>

</div>


<!-- BOTTOM -->
<div class="bottom">

    <button onclick="clearChat()" title="Clear Chat">
        🗑️
    </button>

    <button onclick="darkMode()" title="Dark Mode">
        🌙
    </button>

    <button onclick="showRating()" title="Rate Support">
        ⭐
    </button>

    <button onclick="showInfo()" title="Support Info">
        ℹ️
    </button>

</div>


<!-- RATING -->
<div class="rating" id="rating">

    <b>Rate our support</b>

    <br>

    <span onclick="rate(1)">⭐</span>
    <span onclick="rate(2)">⭐</span>
    <span onclick="rate(3)">⭐</span>
    <span onclick="rate(4)">⭐</span>
    <span onclick="rate(5)">⭐</span>

</div>

</div>


<script>

let input = document.getElementById("message");
let chatBox = document.getElementById("chatBox");
let typing = document.getElementById("typing");


/* SEND MESSAGE */

function sendMessage() {

    let text = input.value.trim();

    if (text === "") return;

    addMessage(text, "user");

    input.value = "";

    document.getElementById("emojiBox").style.display = "none";

    typing.style.display = "block";

    setTimeout(function() {

        typing.style.display = "none";

        let reply = getReply(text);

        addMessage(reply, "bot");

        notification();

    }, 1000);
}


/* ADD MESSAGE */

function addMessage(text, type) {

    let message = document.createElement("div");

    message.className = "message " + type;

    let time = new Date().toLocaleTimeString([], {
        hour: "2-digit",
        minute: "2-digit"
    });

    message.innerHTML =
        text +
        '<span class="time">' +
        time +
        '</span>';

    chatBox.appendChild(message);

    chatBox.scrollTop = chatBox.scrollHeight;
}


/* AUTOMATIC REPLY */

function getReply(text) {

    text = text.toLowerCase();

    if (text.includes("hello") ||
        text.includes("hi") ||
        text.includes("hey")) {

        return "Hello! 😊 How can I help you?";
    }

    if (text.includes("order") ||
        text.includes("track")) {

        return "📦 Please provide your Order ID. We will check the delivery status.";
    }

    if (text.includes("refund") ||
        text.includes("money")) {

        return "💳 Refund requests are normally processed within 5-7 working days.";
    }

    if (text.includes("delivery")) {

        return "🚚 Please provide your Order ID to check your delivery status.";
    }

    if (text.includes("price") ||
        text.includes("cost")) {

        return "💰 Please tell me the product name and I will help you with the price.";
    }

    if (text.includes("help") ||
        text.includes("problem")) {

        return "🆘 Sure! Please explain your problem and our support team will assist you.";
    }

    if (text.includes("thank")) {

        return "You're welcome! 😊 Have a wonderful day!";
    }

    return "Thank you for contacting us! 😊 Our support team will assist you shortly.";
}


/* QUICK MESSAGE */

function quickMessage(text) {

    input.value = text;

    sendMessage();

}


/* EMOJI */

function toggleEmoji() {

    let box = document.getElementById("emojiBox");

    box.style.display =
        box.style.display === "block"
        ? "none"
        : "block";
}


function addEmoji(emoji) {

    input.value += emoji;

    input.focus();

}


/* ENTER KEY */

input.addEventListener("keypress", function(event) {

    if (event.key === "Enter") {

        sendMessage();

    }

});


/* CLEAR CHAT */

function clearChat() {

    chatBox.innerHTML = `
        <div class="message bot">

            Hello! 👋

            <br>

            Welcome to Customer Support.

            <br>

            How can I help you today?

            <span class="time">Now</span>

        </div>
    `;
}


/* DARK MODE */

function darkMode() {

    document.body.classList.toggle("dark");

}


/* RATING */

function showRating() {

    document.getElementById("rating").style.display = "block";

}


function rate(number) {

    alert(
        "Thank you! ⭐ You rated our support " +
        number +
        "/5"
    );

    document.getElementById("rating").style.display = "none";

}


/* SUPPORT INFORMATION */

function showInfo() {

    alert(
        "CUSTOMER SUPPORT\n\n" +
        "🟢 Status: Online\n" +
        "⏰ Available: 24/7\n" +
        "📦 Order Tracking Available\n" +
        "💳 Refund Support Available"
    );

}


/* NOTIFICATION */

function notification() {

    if ("Notification" in window) {

        if (Notification.permission === "granted") {

            new Notification("Customer Support", {
                body: "You received a new support message 💬"
            });

        }

    }

}

</script>

</body>
</html>
